# ── Force Gradle à tourner sur Java 21 ──────────────────────────────────────
# Remplace ce chemin par l'emplacement de ton JDK 21
# Exemples communs sur Windows :
#   org.gradle.java.home=C:/Program Files/Java/jdk-21.0.10
#   org.gradle.java.home=C:/Program Files/Java/jdk-21.0.10
#   org.gradle.java.home=C:/Program Files/Java/jdk-21.0.10
#
# Pour trouver le chemin exact, ouvre un terminal et tape :
#   where java        (Windows)
#   puis remonte d'un niveau jusqu'au dossier jdk-21...
#
org.gradle.java.home=C:/Program Files/Java/jdk-21.0.10

# ── Performances ─────────────────────────────────────────────────────────────
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.jvmargs=-Xmx3g -XX:+UseG1GC

# ── Supprime l'avertissement native-access ───────────────────────────────────
org.gradle.jvmargs=-Xmx3g -XX:+UseG1GC --enable-native-access=ALL-UNNAMED
